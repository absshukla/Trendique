<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Corkboard — Shop My Picks</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <p class="eyebrow">Shop everything I post</p>
    <h1>The Corkboard</h1>
    <p class="subtitle">Every product I've shared — pinned up in one place. Tap a photo to shop it.</p>
  </header>

  <nav class="tags" id="tagFilters">
    <!-- filled in by script.js -->
  </nav>

  <main class="corkboard" id="board">
    <!-- post cards filled in by script.js -->
  </main>

  <div class="overlay" id="overlay">
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <div>
          <p class="drawer-eyebrow">Tagged in this post</p>
          <h2 id="drawerTitle"></h2>
        </div>
        <button id="closeDrawer" aria-label="Close">&times;</button>
      </div>
      <div id="drawerItems" class="drawer-items"></div>
      <div class="drawer-total">
        <span id="itemCount"></span>
        <span id="totalPrice"></span>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> The Corkboard</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
