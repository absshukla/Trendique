<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Add a Product</title>
<link rel="stylesheet" href="style.css" />
<style>
  .admin-wrap { max-width: 600px; margin: 0 auto; padding: 40px 20px 80px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #C9A227; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border-radius: 4px; border: 1px solid #3A3A3D; background: #232326; color: #F2ECDE; font-size: 14px; font-family: 'Work Sans', sans-serif; }
  .product-row { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 8px; margin-bottom: 8px; }
  .product-row input { padding: 8px 10px; font-size: 13px; }
  .btn { padding: 10px 18px; border-radius: 999px; border: 1px solid #3A3A3D; background: transparent; color: #F2ECDE; font-size: 13px; cursor: pointer; font-family: 'Work Sans', sans-serif; }
  .btn:hover { border-color: #8B8478; }
  .btn-primary { background: #D64545; border-color: #D64545; color: #F2ECDE; font-weight: 600; }
  .btn-primary:hover { background: #c23c3c; }
  #output { width: 100%; min-height: 220px; margin-top: 10px; background: #F2ECDE; color: #201D1A; border-radius: 4px; padding: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; border: none; white-space: pre; }
  .note { color: #8B8478; font-size: 13px; line-height: 1.6; margin-top: 8px; }
  .actions { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
</style>
</head>
<body>
  <div class="admin-wrap">
    <p class="eyebrow" style="text-align:left">Admin</p>
    <h1 style="font-family:'Fraunces',serif; font-size:32px; margin:6px 0 4px;">Add a product</h1>
    <p class="note">Fill this in, then copy the code it generates and paste it into the <code>POSTS</code> array at the top of <strong>script.js</strong> (on GitHub: open script.js → pencil/edit icon → paste → commit).</p>

    <div class="field">
      <label>Image URL</label>
      <input id="f-image" placeholder="https://..." />
    </div>
    <div class="field">
      <label>Caption</label>
      <input id="f-caption" placeholder="e.g. Weekend fit check" />
    </div>
    <div class="field">
      <label>Tags (comma separated — e.g. clothing, men)</label>
      <input id="f-tags" placeholder="clothing, men" />
    </div>

    <p class="field label" style="font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#C9A227;">Products in this post</p>
    <div id="productRows"></div>
    <button class="btn" id="addRow" type="button">+ Add another product</button>

    <div class="actions">
      <button class="btn btn-primary" id="generate" type="button">Generate code</button>
      <button class="btn" id="copy" type="button">Copy to clipboard</button>
    </div>

    <textarea id="output" readonly placeholder="Your generated code will appear here..."></textarea>
    <p class="note" id="copyMsg" style="min-height:18px;"></p>
  </div>

  <script>
    const rowsEl = document.getElementById("productRows");

    function addProductRow(name = "", price = "", url = "") {
      const row = document.createElement("div");
      row.className = "product-row";
      row.innerHTML = `
        <input class="p-name" placeholder="Product name" value="${name}" />
        <input class="p-price" placeholder="Price" value="${price}" />
        <input class="p-url" placeholder="Buy link (https://...)" value="${url}" />
      `;
      rowsEl.appendChild(row);
    }
    addProductRow(); // start with one row

    document.getElementById("addRow").onclick = () => addProductRow();

    document.getElementById("generate").onclick = () => {
      const image = document.getElementById("f-image").value.trim();
      const caption = document.getElementById("f-caption").value.trim();
      const tags = document.getElementById("f-tags").value
        .split(",").map((t) => t.trim().toLowerCase()).filter(Boolean);

      const products = [...rowsEl.querySelectorAll(".product-row")].map((row) => {
        const name = row.querySelector(".p-name").value.trim();
        const price = parseFloat(row.querySelector(".p-price").value) || 0;
        const url = row.querySelector(".p-url").value.trim();
        return { name, price, url };
      }).filter((p) => p.name);

      const id = "REPLACE_WITH_NEXT_NUMBER"; // bump this to the next unused id in your POSTS array

      const code =
`  {
    id: ${id},
    image: "${image}",
    caption: "${caption}",
    tags: [${tags.map((t) => `"${t}"`).join(", ")}],
    products: [
${products.map((p) => `      { name: "${p.name}", price: ${p.price}, url: "${p.url}" },`).join("\n")}
    ],
  },`;

      document.getElementById("output").value = code;
    };

    document.getElementById("copy").onclick = () => {
      const out = document.getElementById("output");
      out.select();
      document.execCommand("copy");
      document.getElementById("copyMsg").textContent = "Copied — now paste it inside the POSTS array in script.js.";
    };
  </script>
</body>
</html>
